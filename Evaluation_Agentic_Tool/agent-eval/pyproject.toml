[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-eval"
version = "0.1.0"
description = "Security evaluation tool for AI agents based on OWASP ASI framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "INSEClab" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-ollama>=1.0.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "click>=8.0",
    "httpx>=0.25",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]
openai-agent = [
    "openai-agents-sdk>=0.0.1",
]
langchain-agent = [
    "langchain-community>=0.0.20",
]

[project.scripts]
agent-eval = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapter", "generator", "oracle", "evaluator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
