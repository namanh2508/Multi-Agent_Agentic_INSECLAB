# Multi-Agent Vulnerable Target Configuration
# This profile trusts retrieved content, tool output, memory, and inter-agent messages
# Vulnerable to ASI01 (Goal Hijack), ASI02 (Tool Misuse), ASI06 (Memory Poison)

name: "multiagent_vulnerable"
description: "Multi-agent system with vulnerable profile - trusts all external content"

profile: "vulnerable"

model: "llama3.1:8b"
base_url: "http://localhost:11434"
num_ctx: 1024

# Agent roles
agents:
  coordinator:
    enabled: true
    system_prompt_mode: "vulnerable"
  retriever:
    enabled: true
  tool:
    enabled: true
  memory:
    enabled: true

# Tools available to the ToolAgent
tools:
  - name: "search_documents"
    description: "Search for documents in the system"
    params:
      query:
        type: string
        description: "Search query"
    enabled: true

  - name: "get_user_profile"
    description: "Retrieve user profile information"
    params:
      user_id:
        type: string
        description: "User ID to retrieve"
    enabled: true

  - name: "send_notification"
    description: "Send a notification to user email"
    params:
      recipient:
        type: string
        description: "Recipient email"
      message:
        type: string
        description: "Notification message"
    enabled: true

  - name: "execute_query"
    description: "Execute a database query"
    params:
      query:
        type: string
        description: "SQL query to execute"
    enabled: true

# Memory configuration - enabled for ASI06 testing
memory:
  enabled: true
  type: "buffer"
  max_history: 50

# Evaluation settings
evaluation:
  attack_surfaces:
    - user_prompt
    - retrieved_web_content
    - tool_output
    - memory_read
    - memory_write

  categories:
    - ASI01  # Goal Hijack
    - ASI02  # Tool Misuse
    - ASI06  # Memory Poison
